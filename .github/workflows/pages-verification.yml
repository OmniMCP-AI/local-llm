name: Pages verification

on:
  pull_request:
    paths:
      - "opendesign/mockups/llm-observatory/**"
      - "production/fastest_feedback/schema.sql"
      - ".github/workflows/pages-verification.yml"
  push:
    branches: [main]
    paths:
      - "opendesign/mockups/llm-observatory/**"
      - "production/fastest_feedback/schema.sql"
      - ".github/workflows/pages-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      catalog:
        image: postgres:17
        env:
          POSTGRES_DB: catalog_ci
          POSTGRES_USER: catalog_publisher
          POSTGRES_PASSWORD: ci-publisher
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U catalog_publisher -d catalog_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: opendesign/mockups/llm-observatory
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: opendesign/mockups/llm-observatory/.node-version
          cache: npm
          cache-dependency-path: opendesign/mockups/llm-observatory/package-lock.json
      - run: npm ci
      - name: Prepare the disposable catalog and feedback database
        env:
          FASTEST_TEST_DATABASE_URL: &publisher postgresql://catalog_publisher:ci-publisher@127.0.0.1:${{ job.services.catalog.ports['5432'] }}/catalog_ci
        run: |
          psql -Xw -v ON_ERROR_STOP=1 "$FASTEST_TEST_DATABASE_URL" \
            -f catalog-pg.sql -f ../../../production/fastest_feedback/schema.sql -f - <<'SQL'
          CREATE ROLE catalog_reader LOGIN PASSWORD 'ci-reader';
          ALTER ROLE catalog_reader SET default_transaction_read_only = on;
          GRANT USAGE ON SCHEMA fastest_catalog TO catalog_reader;
          GRANT SELECT ON fastest_catalog.snapshot, fastest_catalog.gpu, fastest_catalog.machine,
            fastest_catalog.runtime, fastest_catalog.model_repository, fastest_catalog.model_artifact,
            fastest_catalog.model_discovery, fastest_catalog.topology_revision, fastest_catalog.topology_node,
            fastest_catalog.topology_link, fastest_catalog.topology_media TO catalog_reader;
          CREATE ROLE feedback_pages LOGIN PASSWORD 'ci-feedback';
          GRANT USAGE ON SCHEMA fastest_feedback TO feedback_pages;
          GRANT EXECUTE ON FUNCTION fastest_feedback.submit_feedback(uuid, text, text, jsonb),
            fastest_feedback.read_feedback_receipt(uuid) TO feedback_pages;
          SQL
      - name: Verify Pages and replay the catalog import
        shell: bash
        env:
          FASTEST_TEST_DATABASE_URL: *publisher
          FASTEST_TEST_CATALOG_READER_URL: &reader postgresql://catalog_reader:ci-reader@127.0.0.1:${{ job.services.catalog.ports['5432'] }}/catalog_ci
          FASTEST_TEST_FEEDBACK_DATABASE_URL: postgresql://feedback_pages:ci-feedback@127.0.0.1:${{ job.services.catalog.ports['5432'] }}/catalog_ci
          NODE_OPTIONS: --test-reporter=tap
        run: |
          results=$(mktemp)
          trap 'rm -f "$results"' EXIT
          hosted_case='production Pages serves the selected PostgreSQL snapshot through the catalog list and profile pairs'
          feedback_case='hosted Pages acknowledges a feedback receipt persisted in PostgreSQL'
          replay_case='the local PostgreSQL snapshot exports ranked repositories and complete factory profiles'

          npm run test:pages | tee "$results"
          grep -qxE "ok [0-9]+ - $hosted_case" "$results"
          grep -qxE "ok [0-9]+ - $feedback_case" "$results"
          node --test --test-name-pattern="^$replay_case$" catalog-release.test.mjs | tee "$results"
          grep -qxE "ok [0-9]+ - $replay_case" "$results"
      - name: Build and verify the Pages review archive
        if: github.event_name == 'pull_request'
        env:
          FASTEST_TEST_DATABASE_URL: *publisher
          FASTEST_TEST_CATALOG_READER_URL: *reader
          PAGES_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node build-pages-review.mjs "$RUNNER_TEMP/pages-review" "$PAGES_REVIEW_HEAD"
      - name: Upload the Pages review archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pages-review/
          if-no-files-found: error
          retention-days: 30
